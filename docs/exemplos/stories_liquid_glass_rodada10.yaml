# Rodada 10 da Pastinha (12/11/2026) no Liquid Glass Divine do portfólio de identidade visual (14/11/2026).
# Três vozes: frase (leve), CHAVE (caixa alta dourada) e fecho (itálico). Escura e clara para o teste A/B.
fotos: fotos
avatar: avatar_daniel.jpg
versoes: [escura, clara]
stories:
  - id: E1
    frase: "Conta quantos destes você já fez"
    chave: "Quem nunca?"
    blocos:
      - tipo: lista
        itens:
          - "Comprou o creme mais caro e usou duas vezes"
          - "Prometeu 2 litros de água e chegou no almoço com um copo"
          - "Disse \"segunda eu começo\" pela quarta segunda seguida"
          - "Pesquisou bioestimulador às 2h da manhã"
          - "Tirou foto no espelho da academia e foi embora"
    fecho: "De 0 a 5, me conta no direct."
    chamada: "Sem julgamento."
  - id: E2
    frase: "Se tivesse que escolher um"
    chave: "Pra sempre"
    blocos:
      - {tipo: opcoes, itens: ["Pele de 25", "Metabolismo de 25"]}
    fecho: "Spoiler: dá pra cuidar dos dois."
    chamada: "Reage com o seu lado e me conta no direct por quê."
  - id: E3
    frase: "Quanto você enrola pra marcar aquela avaliação?"
    chave: "De 0 a 10"
    blocos:
      - {tipo: escala, de: 0, ate: 10, rotulo_de: "Já marquei", rotulo_ate: "Desde 2019"}
    fecho: "Me manda o seu número no direct."
    chamada: "Prometo não julgar."
  - id: E4
    frase: "Eu ia começar a me cuidar,"
    chave: "Mas…"
    blocos:
      - tipo: linhas
        itens: ["Chegou o fim de ano", "Era aniversário de alguém (de novo)", "A Black Friday me distraiu"]
    fecho: "Qual é o seu \"mas\"?"
    chamada: "Me manda no direct que eu respondo."
  - id: E5a
    frase: "Laser CO2 é só pra mancha?"
    chave: "Mito ou verdade"
    blocos:
      - {tipo: opcoes, itens: ["Mito", "Verdade"]}
    fecho: "A resposta tá no próximo Story."
    chamada: "Reage com o seu palpite e não pula."
  - id: E5b
    frase: "Laser CO2 é só pra mancha?"
    chave: "Mito."
    blocos:
      - {tipo: texto, forte: true, texto: "Ele também estimula a renovação da pele e a produção de colágeno."}
      - {tipo: texto, texto: "Por isso entra no cuidado de textura, poros e linhas finas, sempre depois da avaliação."}
    fecho: "Quer saber se é pra você?"
    chamada: "Me chama no direct."
