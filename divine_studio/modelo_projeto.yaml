# Projeto de vídeo Divine Studio. Textos: *palavra* = destaque dourado; " / " = quebra de linha.
titulo: "Tema do vídeo"
data: "{data}"
template: divine            # divine | daniel | george | tv | react | pessoal
formato: reels              # reels | stories | feed45 | feed11 | tv
conteudo_medico: true       # mostra o RT no fechamento e exige na legenda
autorizacao_imagem: pendente  # sim | pendente | nao_aparece | proprio
posicao_texto: topo         # topo | centro | base (texto nunca sobre o rosto)
audio:
  original: true            # voz/som do vídeo
  trilha: true              # trilha lounge original (ducking automático sob a fala)
  limpeza: auto             # auto | minima | leve | forte | elevenlabs | nenhuma
corte_limpo: false          # true: tira muletas, takes repetidos e pausas longas da fala (revise em trabalho/cortes.md)
remover_trechos: []         # frases exatas que saíram ruins, ex.: ["então assim né"]
legendas: false             # true: legenda da fala na tela, palavra a palavra
# texto_da_fala: ocr        # George: lê a legenda queimada (Tesseract) em vez de transcrever
# uso_interno: true         # antes e depois de consulta: libera o revisor e marca o arquivo NAO-POSTAR
# tv: {tratamento: "Laser de CO2", indicacao: "Manchas senis nas mãos"}   # template tv
# clipes_referencia: [...]  e  credito: "@perfil"                        # template react
correcoes: {}               # erros da transcrição, ex.: {"divaine": "Divine"}

clipes:
  - arquivo: bruto/IMG_0001.MOV
    inicio: 0
    fim: 8
    velocidade: 1.0         # < 1 = câmera lenta suave
    foco: [0.5, 0.4]        # âncora do recorte (x, y)
    # mudo: true            # b-roll sem som (não é transcrito)

selo: ""                    # rótulo fixo depois do hook, ex.: "LASER DE CO2 · BASTIDORES"
cta_antecipado: "Manda pra amiga que precisa ver isso."

mensagens:
  - titulo: "Primeira ideia / com *destaque.*"
    apoio: "linha de apoio opcional"
  # - titulo: "Entra junto com a *fala*"
  #   na_fala: "frase que a pessoa diz"   # sincroniza com a transcrição
  # inicio/fim em segundos são opcionais (padrão: em sequência, com tempo de leitura)

fechamento:
  frase: "Cada pele tem o *seu tempo.*"
  cta: "Agende sua avaliação"   # ou "Agende sua sessão" (tecnologias sem avaliação)

# efeitos (opcional; também dentro de cada versão). Lista: python3 -m divine_studio efeitos
# efeitos:
#   - {tipo: circulo, inicio: 6, ponto: [0.5, 0.55], texto: "*Spoiler:* é a mira"}
#   - {codigo: EV07, inicio: 9, titulo: "Quantos desses *você tem?*", itens: [Cansaço, Flacidez]}

versoes:
  - nome: V1
    hook_id: ""             # código no docs/BANCO_HOOKS.md
    # fontes: B             # opcional; sem isso o rodízio escolhe
    hook:
      - titulo: "Frase curta / de *gancho.*"
  - nome: V2
    hook:
      - titulo: "Segunda opção"
        apoio: "com apoio"
  # Atalhos: só hook_id (sem hook) usa a frase do banco; hook: auto sorteia um do banco
  #   (positivo, curiosidade e negativo, fora dos usados por último) e guarda a escolha.
  - nome: V3
    hook:
      - titulo: "Primeira batida."
        duracao: 2.0
      - titulo: "Segunda *batida.*"

legenda: |
  Gancho na primeira linha.

  Já aproveita para seguir, porque aqui a gente mostra o processo de verdade.

  Agende sua avaliação pelo direct ou WhatsApp (11) 94200-9282.
  📍 Av. Paulista 1636 - Ao lado do MASP

  Resultados variam de pessoa para pessoa.
  Resp. técnico: Dr. Daniel Sampaio Mendes · CRM/SP 186.470

  #esteticasp #avenidapaulista #divinemedicalspa
