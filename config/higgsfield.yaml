# Modelos de vídeo (para gerar b-roll, animar foto, editar ou estender um clipe)
modelos:
  - {id: cinematic_studio_video_4_0, nome: "Cinema Studio 4.0", para: "B-roll de cinema da clínica e das tecnologias, com câmera, luz e ritmo controlados", entrada: "texto ou foto"}
  - {id: kling3_0, nome: "Kling 3.0", para: "Animar uma foto com movimento natural, vários planos, com som", entrada: foto}
  - {id: seedance_2_5, nome: "Seedance 2.5", para: "Gerar, editar um clipe ou estender o vídeo para frente ou para trás", entrada: "texto, foto ou vídeo"}
  - {id: kling_video_edit, nome: "Kling Omni Edit", para: "Editar um clipe com uma frase (trocar fundo, luz, roupa)", entrada: video}
  - {id: minimax_h3, nome: "MiniMax H3 (2K)", para: "Vídeo em 2K a partir de quadros-chave (início e fim)", entrada: "fotos"}
  - {id: marketing_studio_video, nome: "Marketing Studio", para: "Anúncio de produto pronto para Reels (UGC, tutorial, review)", entrada: "foto do produto"}

# Ferramentas (melhorar o que já foi gravado)
ferramentas:
  - {id: video_upscale, nativo: qualidade, nome: "Upscale", para: "Aumentar a resolução do clipe", entrada: video}
  - {id: topaz_video, nativo: qualidade, nome: "Topaz (4K)", para: "Nitidez e 4K de verdade, câmera lenta suave", entrada: video}
  - {id: reframe, nativo: enquadrar, nome: "Reframe", para: "Transformar vídeo deitado (16:9) em vertical 9:16 sem perder a pessoa", entrada: video}
  - {id: video_background_remover, nativo: desfoque_fundo, nome: "Tirar fundo", para: "Recortar a pessoa do vídeo (tela verde sem tela verde)", entrada: video}
  - {id: video_deflicker, nativo: deflicker, nome: "Tirar tremulação", para: "Corrigir piscadas de luz (lâmpada, tela)", entrada: video}
  - {id: dubbing, nome: "Dublagem", para: "Versão do vídeo em outro idioma (inglês, espanhol) com a mesma voz", entrada: video}
  - {id: sync_so, nome: "Lipsync", para: "Sincronizar a boca com um áudio novo (corrigir uma frase)", entrada: "video + áudio"}
  - {id: virality_predictor, nativo: atencao, nome: "Virality Predictor", para: "Prever viralidade, gancho, retenção e risco de queda antes de postar", entrada: video}
