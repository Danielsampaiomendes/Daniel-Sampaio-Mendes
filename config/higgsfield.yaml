# Higgsfield AI dentro do Divine Studio (catálogo lido do conector em 07/11/2026, conta Plus).
# O app monta o PEDIDO (efeito/modelo + quadro ou clipe + prompt no padrão Divine). Quem executa é o Claude com o
# conector do Higgsfield (ver docs/HIGGSFIELD_PONTE.md): ele mostra o custo em créditos, pede o seu ok, gera e devolve
# o resultado para o projeto. Atualize o catálogo pedindo ao Claude: "atualiza o catálogo do Higgsfield no Divine Studio".

# Regras que valem em TODO pedido (o app junta ao prompt)
regras_prompt: >-
  Padrão Divine Medical Spa: luxo discreto, luz quente, preto, dourado e off-white, aspecto cinematográfico real,
  formato vertical 9:16. Sem texto na imagem, sem logos de outras marcas. Não alterar rosto nem corpo de pacientes,
  sem antes e depois, sem prometer resultado (CFM 2.336/2023). Só pessoas da equipe com autorização de imagem.
rotulo_ia: true          # ao postar algo gerado por IA, ligue o rótulo "Feito com IA" do Instagram (o app lembra)
formato_padrao: "9:16"

# Teto de créditos (o Claude sempre mostra o custo e espera o seu ok; estes tetos ele não passa sem você mandar)
orcamento:
  por_video: 60
  por_semana: 250

# Efeitos virais (Viral Hub) que combinam com a Divine. id = preset do Higgsfield; entrada = o que mandar.
# nativo = versão feita no próprio Divine Studio (grátis, sem internet). Sem 'nativo' = precisa de IA generativa.
