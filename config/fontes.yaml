# Banco de combinações de fontes (Biblioteca_Fontes/LEIA-ME.md). Máximo 2 famílias por vídeo.
# titulo/apoio: arquivo em Biblioteca_Fontes/ttf, peso (eixo wght quando a fonte é variável),
# caixa_alta, tracking (fração do tamanho), escala (título: x92 px no hook; apoio: x57 px).
# destaque: como a palavra-chave (*assim*) é desenhada: arquivo + peso, sempre em dourado.
pasta: Biblioteca_Fontes/ttf

# Rodízio: desde 31/10/2026 o padrão é título grande em CAIXA ALTA (dourado em degradê) + cursiva fina colada
# embaixo (skill divine-fontes). Só estas entram no rodízio automático; as outras continuam escolhíveis à mão.
rodizio: [O1, O2, O3, O4, O5, O6, E, H, K, L, N]

# Degradê dourado do título no padrão novo (de cima para baixo) e sombra escura suave
degrade_dourado: ["#F5E9BE", "#D6BE7D", "#B09458"]

combinacoes:
