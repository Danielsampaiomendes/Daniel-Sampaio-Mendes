# Regras de edição do Renato (docs/CONHECIMENTO_DIVINE.md, seção 7). Valores numéricos usados pelo template.
versoes_por_video: 3
max_fontes_por_video: 2

animacao:
  entrada_s: 0.9          # fade + deslize lento
  saida_s: 0.6
  deslize_px: 34
  dissolve_entre_clipes_s: 0.35   # 0 = corte seco
  zoom_respiro: {amplitude: 0.035, ciclo_s: 26}

texto:
  leitura_palavras_por_s: 3.2     # tempo mínimo na tela = palavras / esse valor
  tempo_minimo_s: 1.6
  largura_max_px: 900
  sombra: true
  placa_escura: auto              # auto | sempre | nunca

fechamento:
  duracao_s: 2.6                  # curto: Código Viral pede "porta na cara"
  escurecer_final_s: 0.5

trilha:
  usar: true
  bpm: 84
  volume_db: -22
  ducking_db: -34                 # volume da trilha embaixo de fala
  entrada_s: 2.0

transcricao:
  motor: auto                     # auto | assemblyai | faster_whisper | whisper
  idioma: pt
  modelo_whisper: small           # small é bom no Mac; medium acerta mais nomes, mas é mais lento

corte:                            # corte limpo (tirar enrolação, takes ruins e pausas)
  cortar_pausas_acima_s: 0.9      # pausa maior que isso é encurtada
  pausa_natural_s: 0.5            # ...para ficar com esta pausa
  margem_antes_s: 0.12            # respiro antes da 1ª palavra de cada trecho
  margem_depois_s: 0.3            # respiro depois da última palavra do clipe
  trecho_minimo_s: 0.5            # trechos menores que isso se juntam ao vizinho
  retake_min_palavras: 3          # recomeçou a frase com as mesmas 3 palavras = take repetido
  retake_janela_palavras: 25
  muletas: [hum, humm, hmm, ahn, ãh, hã, eh, éé, ééé, ãã, uhm]

voz:
  modo: auto                      # auto | minima | leve | forte | elevenlabs | nenhuma
  highpass_hz: 80
  snr_ruido_leve_db: 32           # distância fala/ruído abaixo disso: limpeza leve
  snr_ruido_pesado_db: 18         # abaixo disso: forte (ou ElevenLabs, se houver ELEVENLABS_API_KEY)
  modelo_rnnoise: config/rnnoise/sh.rnnn   # opcional (github.com/GregorR/rnnoise-models); sem ele usa redução FFT

legendas:                         # legenda da fala na tela (skill divine-legendas-animadas; liga com `legendas: true`)
  tamanho: 58
  cor: off_white
  opacidade_outras: 0.85          # palavras que não estão sendo faladas
  escala_falada: 1.06             # a palavra falada cresce de leve, em branco cheio
  fonte_chave: "Lora-Italic[wght].ttf"   # palavra-chave do bloco em Lora itálico dourado (uma por bloco)
  cor_chave: dourado
  palavras_chave: [gordura, flacidez, queda, cabelo, celulite, mancha, manchas, cicatriz, estria, colageno, pele,
    musculo, firmeza, diagnostico, causa, avaliacao, sessao, tratamento, hormonio, hormonios, energia, cuidado,
    tempo, saude, autoestima, renovacao, textura, sono, cansaco, metabolismo, inflamacao, protocolo, acompanhamento]
  palavra_a_palavra: true
  caixa_alta: false
  max_palavras: 4
  max_caracteres: 24
  pausa_quebra_s: 0.35
  posicao: 0.66                   # centro do bloco (fração da altura): no peito, acima do CTA e fora da UI
  largura_max_px: 820
  entrada_s: 0.12                 # fade de 120 ms com deslize de 8 px: acompanha a fala sem piscar
  saida_s: 0.12
  deslize_px: 8
  segurar_s: 0.35
  minimo_s: 0.7

acabamento:                       # skill divine-video-pro: grão fino unifica celular e gráficos
  grao: 4                         # 0 desliga

progresso:
  altura_px: 6
  cor: dourado

# Regras aprendidas: o comando `divine regra "texto"` acrescenta aqui (e em docs/CONHECIMENTO_DIVINE.md)
regras_aprendidas: []
