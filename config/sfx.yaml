# Biblioteca_SFX/1_kit_original_divine (só sons livres para uso comercial)
pasta: Biblioteca_SFX/1_kit_original_divine

# Para que serve cada família (aparece no painel ao escolher um som na linha do tempo)
familias:
  whoosh_suave: "zoom, texto deslizando, troca de cena"
  brilho_dourado: "revelação, brilho dourado"
  ding_suave: "informação importante, dica, check"
  notificacao_suave: "card de pergunta, comentário, DM"
  tick_suave: "itens de lista aparecendo"
  pop_suave: "selo, ícone, pílula surgindo"
  camera_shutter: "transição rápida, bastidores"
  impacto_grave_suave: "ênfase no hook (no máximo 1 por vídeo)"
  riser_suave: "suspense antes de revelar"
  swell_reverso: "respiro antes de texto importante"
  cristal: "condição, tela final, CTA"
  # kit viral (divine_studio/sfx_viral.py, sintetizado e livre de direitos)
  boom_grave: "impacto tipo boom no gancho ou na revelação (1 por vídeo)"
  drop_sub: "queda grave depois de um riser: entrada da batida"
  whoosh_rapido: "passada rápida: chicote, zoom blur, troca de cena"
  glitch_digital: "falha digital: glitch RGB"
  flash_brilho: "estalo brilhante: flash branco ou dourado"
  scratch_disco: "arranhão de disco: pausa, virada cômica"
  coracao: "batida de coração: suspense, pulso"
  zap_suave: "raio curto: giro, transição rápida"
  estalo_dedos: "estalo de dedos: corte seco, troca de look, cor que volta"
  subida_tensao: "riser curto de tensão antes do drop ou da revelação"

# Ganho padrão em dB relativo ao arquivo (o kit sai normalizado em -1 dBFS); tudo bem abaixo da trilha
ganho_db: -24

# Ciclo do som de abertura (hook): muda a cada vídeo/versão, nunca repete a variação recente
abertura:
  - [impacto_grave_suave_a]
  - [brilho_dourado_a]
  - [swell_reverso_a, brilho_dourado_b]
  - [notificacao_suave_a]
  - [camera_shutter_a]
  - [impacto_grave_suave_b]
  - [brilho_dourado_c]
  - [swell_reverso_b]
  - [notificacao_suave_b]
  - [pop_suave_b, ding_suave_b]
  - [riser_suave_a, cristal_a]
  - [impacto_grave_suave_c]

# Som do fechamento (um só, leve)
fechamento:
  - [cristal_a]
  - [ding_suave_c]
  - [whoosh_suave_b, brilho_dourado_c]
  - [cristal_b]
  - [ding_suave_a]

# Troca entre clipes diferentes (dissolve): whoosh bem baixo, no máximo 3 por vídeo, longe um do outro.
# Cortes secos do corte limpo (mesmo take) nunca têm som.
transicao:
  - [whoosh_suave_a]
  - [whoosh_suave_b]
  - [whoosh_suave_c]
transicao_ganho_db: -30
transicao_max: 3
transicao_intervalo_s: 4.0

# Limites por vídeo (docs/CONHECIMENTO_DIVINE.md, seção 10)
max_familias: 4
max_impactos: 1

# Em transições entre mensagens: por padrão nenhum som (o Renato achou o ping repetitivo)
mensagens: []
