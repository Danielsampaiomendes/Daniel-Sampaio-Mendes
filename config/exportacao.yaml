# Presets de formato e exportação
formatos:
  reels:   {largura: 1080, altura: 1920}
  stories: {largura: 1080, altura: 1920}
  feed45:  {largura: 1080, altura: 1350}
  feed11:  {largura: 1080, altura: 1080}
  tv:      {largura: 1920, altura: 1080}

fps: 30

video:
  codec: libx264
  preset: slow
  tune: film
  crf: 17
  x264_params: "aq-mode=3:deblock=-1,-1"
  pix_fmt: yuv420p

# Limite de envio (MB). Se o arquivo final passar disso, refaz em 2 passes no bitrate certo.
limite_mb: 30

audio:
  codec: aac
  bitrate: 192k
  taxa: 48000
  lufs_alvo: -16

# Modo alta qualidade (fonte em baixa resolução ou cena clara)
alta_qualidade:
  altura_minima: 1080      # abaixo disso liga automaticamente
  denoise: "hqdn3d=1.5:1.5:6:6"
  nitidez: "unsharp=5:5:0.6:5:5:0.0"
  crf_intermediario: 13
  final_hevc: true          # HEVC (hvc1) em 2 passes abaixo do limite
  preset_hevc: medium
